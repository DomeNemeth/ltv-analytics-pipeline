name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml, so the lockfile
      # cannot silently drift from the declared dependencies.
      - name: Install locked environment
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Source data is fetched, not committed. Cache it on its pinned checksum so CI does not hammer
      # a personal academic web server on every push, and so a transient outage there does not fail
      # an unrelated build.
      # Keyed on the file that holds the pinned checksum, so bumping the pin invalidates the cache
      # automatically. Hardcoding the checksum here instead would leave CI restoring a stale file
      # that then fails verification on every run, with no way for the runner to clear it.
      - name: Cache source data
        uses: actions/cache@v6
        with:
          path: data/raw
          key: cdnow-${{ hashFiles('src/ltv/ingest/cdnow.py') }}

      - name: Ingest source data
        run: uv run ltv ingest cdnow

      # Runs the dbt models and every dbt test. Separate from pytest even though the integration
      # tests build their own warehouse, because this is the command the README tells a reader to
      # run -- if it breaks, the documented workflow is broken, and asserting on a warehouse that
      # only pytest knows how to build would not notice.
      - name: Transform
        run: uv run ltv transform

      # Fits the models for the same reason the transform step exists: it is a command the README
      # tells a reader to run, and the unit tests exercise it only on a small synthetic population.
      # This runs it on the full 23,570 customers, on Linux, from a clean environment.
      #
      # Note what this does NOT prove. `ltv fit` selects the numba backend itself, so this runs the
      # same backend the development host does -- it is not a C-backend portability check. PyTensor
      # here cannot even link BLAS (pip install, no conda), and its own warning recommends numba as
      # the fix. Nothing in this project is currently exercised on the C backend.
      #
      # MAP only. A --full-bayes NUTS run is minutes rather than seconds and belongs on a machine
      # someone is watching.
      - name: Fit
        run: uv run ltv fit

      # Scores the fit against the holdout window. This is also the only step that builds the
      # post-fit half of the dbt DAG -- `ltv transform` above deliberately excludes `tag:post_fit`,
      # because those models read a predictions table that does not exist until the fit has run.
      # So this step runs four dbt tests nothing else in CI reaches, including the guard that the
      # predictions still match the data they were fitted on.
      #
      # --compare-models, because the step below diffs the committed report and the report has a
      # model-comparison section in it. Running the cheaper form here would regenerate a report
      # missing that section and fail the diff on every build -- so the flag is not optional
      # decoration, it is what makes "the committed report is reproducible" a checkable claim.
      # It costs about a minute: MBG/NBD fits in under ten seconds and Pareto/NBD in twenty.
      - name: Validate
        run: uv run ltv validate --compare-models

      # The reports and charts are committed, and `ltv validate` has just regenerated them from the
      # data CI built itself. If they differ, either the committed report was produced from
      # something other than the current code, or the pipeline is not reproducible -- both are
      # failures, and both are invisible without this check. It is also what keeps the determinism
      # rule in ltv/report.py honest rather than aspirational.
      - name: Reports are reproducible
        run: git diff --exit-code -- reports/

      # Runs the integration tests too, since the data is now present. Those assert the documented
      # row and customer counts, so a silently truncated download fails the build.
      - name: Test
        run: uv run pytest
