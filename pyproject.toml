[project]
name = "ltv-analytics-pipeline"
version = "0.1.0"
description = "Probabilistic customer lifetime value pipeline: transactions to DuckDB to dbt to BG/NBD + Gamma-Gamma to a published dashboard"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # warehouse + dataframes
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    # transformation
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    # probabilistic CLV modelling
    "pymc-marketing>=0.10",
    # PyTensor backends that need no C compiler (see CLAUDE.md: no compiler on the development host)
    "numba>=0.60",
    "nutpie>=0.13",
    # orchestration
    "prefect>=3.1",
    # plumbing
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "httpx>=0.27",
    "matplotlib>=3.9",
]

[project.scripts]
ltv = "ltv.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltv"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
